<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Цифровой механик</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0e1013; color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 650; margin: 0 0 8px; }
    p { margin: 0; color: #9aa0a6; font-size: 15px; line-height: 1.45; max-width: 360px; }
    .row { display: flex; gap: 10px; margin-top: 28px; }
    button { appearance: none; border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary { background: #4c8dff; color: #fff; }
    button.ghost { background: #1a1d22; color: #e8eaed; }
  </style>
</head>
<body>
  <img src="assets/icon.png" alt="">
  <h1>Цифровой механик</h1>
  <p id="status">Нет связи со стендом. Проверьте сеть или укажите другой адрес в меню «Файл → Адрес сервера».</p>
  <div class="row">
    <button class="primary" id="retry" type="button">Повторить</button>
    <button class="ghost" id="change" type="button">Адрес сервера</button>
  </div>
  <script>
    document.getElementById("retry").onclick = () => {
      if (window.electronAPI) window.electronAPI.reload();
      else location.reload();
    };
    document.getElementById("change").onclick = () => {
      if (window.electronAPI) window.electronAPI.openSettings();
    };
  </script>
</body>
</html>
