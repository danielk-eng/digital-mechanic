<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1013"><link rel="manifest" href="/static/manifest.json"><link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>Цифровой механик</title>
<link rel="preload" href="/static/fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/a11y.js"></script><script src="/static/icons.js"></script><script src="/static/timeline.js" defer></script>
</head><body>

<section id="login" class="login hidden">
  <div class="login-box">
    <div class="brand"><div class="logo" data-icon="wrench"></div><h1 data-t="app_title">Цифровой механик</h1></div>
    <div class="field"><label for="l_name" data-t="login_name">Ваше имя</label><input id="l_name" class="input" type="text" autocomplete="name"></div>
    <div class="field"><span class="label" data-t="role">Роль</span>
      <div class="seg" id="l_role"><button data-v="mechanic" class="on" data-t="role_mechanic">Механик</button><button data-v="manager" data-t="role_manager">Главный механик</button></div></div>
    <div class="field"><label for="l_lang" data-t="language">Язык</label><select id="l_lang" class="input"></select></div>
    <label class="check"><input id="l_consent" type="checkbox"><span><span data-t="consent">Согласие на обработку персональных данных</span> (<a href="/privacy" target="_blank" data-t="policy">политика</a>)</span></label>
    <p class="note" data-t="privacy_note">Данные сессии хранятся на сервере заказчика. В языковую модель уходит только замаскированный текст запроса.</p>
    <button class="btn primary block" id="l_go" data-t="enter">Войти</button>
  </div>
</section>

<div id="app" class="hidden">
  <header class="appbar">
    <button class="veh-btn" id="vehBtn" aria-haspopup="dialog">
      <span class="dot" id="vehDot"></span>
      <span class="t"><b id="vehTitle">Выберите машину</b><span id="vehSub"></span></span>
      <span data-icon="chevron-down" data-size="18" class="chev"></span>
    </button>
    <button class="icon-btn hidden" id="btnMenu" data-t-aria="actions" data-icon="ellipsis"></button>
    <button class="icon-btn" id="btnSettings" data-t-aria="settings" data-icon="settings"></button>
  </header>
  <main class="chat-main" id="main">
    <section id="empty" class="hidden"></section>
    <section id="vehInfo" class="veh-card hidden"></section>
    <div id="chat" class="chat" aria-live="polite"></div>
  </main>
  <footer class="composer hidden" id="composer"><div class="inner">
    <div class="suggest" id="quick"></div>
    <div class="inputbox">
      <label class="icon-btn" role="button" tabindex="0" data-t-aria="photo" data-icon="camera"><input id="photo" type="file" accept="image/*" capture="environment" hidden></label>
      <textarea id="txt" rows="1" data-tp="ask_placeholder" enterkeyhint="send"></textarea>
      <button class="icon-btn send-btn hidden" id="send" data-t-aria="send" data-icon="arrow-up"></button>
      <button class="icon-btn mic-btn" id="mic" data-t-aria="voice_mode" data-icon="audio-lines"></button>
    </div>
  </div></footer>
</div>

<div id="viewer" class="viewer hidden" role="dialog" aria-modal="true">
  <div class="vhd"><button class="icon-btn" id="mClose" data-t-aria="close" data-icon="arrow-left"></button><div class="t"><b id="mTitle"></b><span id="mSub"></span></div>
    <a class="icon-btn hidden" id="mPdf" target="_blank" data-t-aria="open_pdf" data-icon="external-link"></a></div>
  <div class="vbd"><div class="wrap" id="mBody"></div></div>
</div>

<div id="voice" class="voice hidden" role="dialog" aria-modal="true">
  <div class="vtop"><span class="vstate" id="vState"></span><button class="icon-btn" id="vClose" data-t-aria="close" data-icon="x"></button></div>
  <div class="stage">
    <div class="said" id="vSaid"></div>
    <button class="orb" id="vOrb" data-state="idle" data-t-aria="voice_mode"><span id="vOrbIc"></span></button>
    <div class="reply" id="vReply"></div>
    <div class="hint" id="vHint"></div>
  </div>
  <div class="vbottom"><button class="btn ghost" id="vExit" data-t="voice_exit">Завершить разговор</button></div>
</div>

<div id="caption" class="caption hidden" aria-live="polite"></div>
<div id="layer"></div>
<script src="/static/app.js"></script>
</body></html>
