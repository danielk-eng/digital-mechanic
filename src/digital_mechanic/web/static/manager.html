<!doctype html>
<html lang="ru" class="mgr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Главный механик · Цифровой механик</title><link rel="manifest" href="/static/manifest.json"><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Механик">
<link rel="stylesheet" href="/static/app.css"><script src="/static/a11y.js"></script><script src="/static/icons.js"></script><script src="/static/webstt.js"></script><script src="/static/qr.js" defer></script><script src="/static/timeline.js" defer></script></head>
<body>
<header class="mgr-bar">
  <h1 data-t="manager">Панель главного механика</h1>
  <span class="small muted" id="whoami"></span><a class="btn ghost sm" href="/?mechanic=1" data-t="role_mechanic">Механик</a>
  <button class="btn ghost sm" id="myqr" data-t="qr_login">QR-вход</button>
  <button class="icon-btn" id="theme" aria-label="theme" data-icon="moon"></button><button class="icon-btn" id="snd" aria-label="Звук нажатий" data-t-aria="tap_sounds" aria-pressed="true"></button>
  <button class="icon-btn" id="logout" aria-label="logout" data-icon="log-out"></button>
</header>
<main class="mgr-main">
  <div class="kpis" id="kpis"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="fleet" class="on" data-t="priority_list">Приоритетный список</button>
    <button data-tab="tickets" data-t="tickets">Заявки</button>
    <button data-tab="repairs" data-t="in_repair">В ремонте</button>
    <button data-tab="handoffs" data-t="handoffs_tab">Передано главному</button>
    <button data-tab="ask" data-t="agent_tab">Агент</button>
    <button data-tab="users" data-t="users_tab">Сотрудники</button>
    <button data-tab="audit" data-t="audit">Журнал запросов</button>
    <button data-tab="econ" data-t="econ_tab">Экономика</button>
  </nav>
  <div id="fbar"></div>
  <section id="tab-fleet"></section>
  <section id="tab-tickets" class="hidden"></section>
  <section id="tab-repairs" class="hidden"></section>
  <section id="tab-handoffs" class="hidden"></section>
  <section id="tab-audit" class="hidden"></section>
  <section id="tab-users" class="hidden"></section>
  <section id="tab-ask" class="hidden"><div class="panel"><div class="pad"><div id="mchat" class="chat mchat"></div>
    <div class="inputbox" style="margin-top:16px"><textarea id="mtxt" rows="1" data-tp="ask_any_ph" placeholder="Задайте вопрос"></textarea><button class="icon-btn mic-btn" id="mmic" aria-label="voice" data-icon="mic"></button><button class="icon-btn send-btn" id="msend" aria-label="send" data-icon="arrow-up"></button></div></div></div></section>
  <section id="tab-econ" class="hidden"></section>
  <p class="small muted" style="margin-top:24px" data-t="privacy_note"></p>
</main>
<div id="layer"></div>
<script src="/static/manager.js"></script>
</body></html>
