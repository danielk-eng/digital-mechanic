# One command: docker compose up -d --build   ->  http://localhost:8000
services:
  mock-ml:
    build: ./vendor/neurodvs_mock
    command: uvicorn mock_ml.app:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
  mock-toir:
    build: ./vendor/neurodvs_mock
    command: uvicorn mock_toir.app:app --host 0.0.0.0 --port 8002
    restart: unless-stopped
  app:
    build: .
    ports: ["${PORT:-8000}:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://mock-ml:8001}
      TOIR_SERVICE_URL: ${TOIR_SERVICE_URL:-http://mock-toir:8002}
    volumes:
      - ./var:/app/var              # SQLite, uploads, logs: local storage (152-FZ)
      - ./data/manuals:/app/data/manuals:ro   # PDFs for page images (optional, see scripts/fetch_manuals.py)
    depends_on: [mock-ml, mock-toir]
    restart: unless-stopped
