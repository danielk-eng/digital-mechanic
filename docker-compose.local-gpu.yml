# Fully local mode on the engineer's GPU (docs/LOCAL_GPU.md). Overlay on top of docker-compose.yml:
#   cp local-gpu.env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.local-gpu.yml --profile gpu3090 up -d        # RTX 3090: Qwen3.8-27B
#   docker compose -f docker-compose.yml -f docker-compose.local-gpu.yml --profile gpu3090-fast up -d   # RTX 3090: Qwen3-30B-A3B (swap)
#   docker compose -f docker-compose.yml -f docker-compose.local-gpu.yml --profile spark up -d     # DGX Spark (arm64): 35B-A3B + 27B «Подробнее»
# Both LLM services answer as host "llm" (OpenAI-compatible /v1) and speech as host "speech", so the app config is the same.
services:
  # RTX 3090, profile gpu3090 (primary, V 27.11): Qwen3.8-27B UD-Q4_K_M (15.4 GiB) dense + vision, thinking off,
  # MTP n=2 (llama.cpp PR #22673; the gain is single-stream, gone by ~4 parallel streams), 2 slots x 12k, q8_0 KV
  llm-3090:
    profiles: [gpu3090]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b12808}
    command: >
      -hf ${LOCAL_GGUF:-unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M}
      --alias local-llm --jinja -ngl 999 --flash-attn on
      --chat-template-kwargs '{"enable_thinking": false}'
      --spec-type draft-mtp --spec-draft-n-max ${LOCAL_MTP_N:-2}
      -c ${LOCAL_CTX_TOTAL:-24576} -np ${LOCAL_SLOTS:-2} --cache-type-k q8_0 --cache-type-v q8_0
      --temp 0.1 --host 0.0.0.0 --port 8080 --api-key ${LOCAL_LLM_KEY:-local} ${LOCAL_EXTRA_ARGS:-}
    volumes: ["${MODELS_DIR:-./var/models}/llama.cpp:/root/.cache/llama.cpp"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
    healthcheck: {test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"], interval: 15s, timeout: 5s, retries: 80, start_period: 60s}
    networks: {default: {aliases: [llm]}}
    restart: unless-stopped

  # RTX 3090, profile gpu3090-fast (swap in instead of llm-3090; both do not fit on 24 GB):
  # Qwen3-30B-A3B-Instruct-2507 Q4_K_M (17.3 GiB), ~190 tok/s, 3 slots x 12k
  llm-3090-fast:
    profiles: [gpu3090-fast]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b12808}
    command: >
      -hf ${LOCAL_GGUF_FAST:-unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M}
      --alias local-llm --jinja -ngl 999 --flash-attn on
      -c ${LOCAL_CTX_TOTAL_FAST:-36864} -np ${LOCAL_SLOTS_FAST:-3} --cache-type-k q8_0 --cache-type-v q8_0
      --temp 0.1 --host 0.0.0.0 --port 8080 --api-key ${LOCAL_LLM_KEY:-local}
    volumes: ["${MODELS_DIR:-./var/models}/llama.cpp:/root/.cache/llama.cpp"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
    healthcheck: {test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"], interval: 15s, timeout: 5s, retries: 80, start_period: 60s}
    networks: {default: {aliases: [llm]}}
    restart: unless-stopped

  # DGX Spark, primary (V 27.11): Qwen3.6-35B-A3B FP8 (~90 tok/s NVFP4+MTP measured, replaces 30B-A3B); vLLM upstream arm64 image
  llm-spark:
    profiles: [spark]
    image: ${SPARK_VLLM_IMAGE:-vllm/vllm-openai:v0.32.0}
    entrypoint: ["vllm", "serve"]
    command: >
      ${SPARK_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}
      --served-model-name local-llm --max-model-len ${LOCAL_MAX_LEN:-16384}
      --gpu-memory-utilization ${SPARK_GPU_UTIL:-0.35} --max-num-seqs ${LOCAL_SLOTS_SPARK:-8}
      --enable-auto-tool-choice --tool-call-parser ${SPARK_TOOL_PARSER:-qwen3_coder}
      --default-chat-template-kwargs '{"enable_thinking": false}' --reasoning-parser qwen3
      --host 0.0.0.0 --port 8080 --api-key ${LOCAL_LLM_KEY:-local}
    environment: {HF_HOME: /models/hf}
    volumes: ["${MODELS_DIR:-./var/models}:/models"]
    ipc: host
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    healthcheck: {test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"], interval: 15s, timeout: 5s, retries: 120, start_period: 180s}
    networks: {default: {aliases: [llm]}}
    restart: unless-stopped

  # DGX Spark, second server "llm-quality": Qwen3.8-27B NVFP4 (QAD) + MTP, thinking off. The app sends the background
  # «Подробнее» (step expand) and shift summaries here (LLM_QUALITY_URL); questions stay on the fast 35B-A3B.
  llm-spark-quality:
    profiles: [spark]
    image: ${SPARK_VLLM_IMAGE:-vllm/vllm-openai:v0.32.0}
    entrypoint: ["vllm", "serve"]
    command: >
      ${SPARK_QUALITY_MODEL:-nvidia/Qwen3.8-27B-NVFP4-QAD} ${SPARK_QUALITY_QUANT_ARGS---quantization modelopt}
      --served-model-name local-llm --max-model-len ${LOCAL_MAX_LEN:-16384}
      --gpu-memory-utilization ${SPARK_QUALITY_GPU_UTIL:-0.30} --max-num-seqs 8 --kv-cache-dtype fp8
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 2}'
      --default-chat-template-kwargs '{"enable_thinking": false}'
      --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder
      --host 0.0.0.0 --port 8080 --api-key ${LOCAL_LLM_KEY:-local}
    environment: {HF_HOME: /models/hf}
    volumes: ["${MODELS_DIR:-./var/models}:/models"]
    ipc: host
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    healthcheck: {test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"], interval: 15s, timeout: 5s, retries: 120, start_period: 300s}
    networks: {default: {aliases: [llm-quality]}}
    restart: unless-stopped

  # Speech on the same GPU: GigaAM-v3 (ru), GigaAM-Multilingual-v2 (kk, uz), whisper-large-v3-turbo (hi, vi, fallback), Silero v5 CIS TTS (MIT)
  speech-gpu:
    profiles: [gpu3090, gpu3090-fast, spark]
    build:
      context: ./services/speech_gpu
      args:
        BASE: ${SPEECH_BASE_IMAGE:-pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime}   # spark: nvcr.io/nvidia/pytorch:26.11-py3
    environment:
      GIGAAM_DEVICE: ${GIGAAM_DEVICE:-cuda}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}        # 3090: cpu (VRAM is for the LLM); x86 with spare VRAM: cuda
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      TTS_SPEAKER: ${TTS_SPEAKER:-ru_zhadyra}
      MODELS_DIR: /models
    volumes: ["${MODELS_DIR:-./var/models}:/models"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
    healthcheck: {test: ["CMD", "python3", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:9000/health')).get('ready') else 1)"], interval: 15s, timeout: 5s, retries: 80, start_period: 60s}
    networks: {default: {aliases: [speech]}}
    restart: unless-stopped

  app:
    environment:
      # the app's OpenAI-compatible slot ("tokenrouter" in LLM_PRIMARY) points at the local server
      LLM_BASE_URL: ${LOCAL_LLM_URL:-http://llm:8080/v1}
      LLM_MODEL: local-llm
      LLM_API_KEY: ${LOCAL_LLM_KEY:-local}
      LLM_PRIMARY: ${LLM_PRIMARY:-local}
      LLM_QUALITY_URL: ${LLM_QUALITY_URL:-}    # spark: http://llm-quality:8080/v1 -> «Подробнее» on Qwen3.8-27B
      LLM_HEDGE_S: "0"            # no duplicate requests on our own GPU
      LLM_HEDGE_TTFT_S: "60"      # min 0.5 in code; 60 s = effectively off
      LLM_TURN_BUDGET_S: ${LLM_TURN_BUDGET_S:-90}
      SPEECH_URL: http://speech:9000
      STT_ORDER: local-first
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}   # empty = strict local; set = GigaChat-4 (RF) as fallback, PII masked
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      PII_MASKING: "true"
    depends_on:
      llm-3090: {condition: service_healthy, required: false}
      llm-3090-fast: {condition: service_healthy, required: false}
      llm-spark: {condition: service_healthy, required: false}
      speech-gpu: {condition: service_started, required: false}
